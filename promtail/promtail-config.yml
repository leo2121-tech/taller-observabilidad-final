server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloud-simulated-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloud-logs
          env: production
          __path__: /var/log/custom/*.log

    pipeline_stages:
      # 1. Extrae campos del JSON de cada línea
      - json:
          expressions:
            level: level
            service: service
            msg: msg
            timestamp: timestamp
      # 2. Usa el timestamp del log, no la hora de ingesta
      - timestamp:
          source: timestamp
          format: RFC3339
      # 3. Promueve level y service a etiquetas indexadas de Loki
      - labels:
          level:
          service:
      # 4. Guarda solo el texto del mensaje como contenido de la línea
      - output:
          source: msg
