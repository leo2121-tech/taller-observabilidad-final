server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloud-simulated-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloud-logs
          env: production
          __path__: /var/log/custom/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            msg: msg
            timestamp: timestamp
        - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
      - output:
          source: msg
